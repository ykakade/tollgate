# Tollgate configuration.
# Every field is described in docs/configuration.md.
version: 1

server:
  # The address of the data plane. Clients send requests to this address.
  listen: ":8080"
  # The largest request body that Tollgate accepts.
  max_body_bytes: 16MiB
  # After SIGTERM, the longest time that open requests can continue.
  drain_timeout: 10m
  # The admin port serves /metrics for Prometheus. On an address that is
  # not 127.0.0.1, also set admin_token, for example env:TOLLGATE_ADMIN_TOKEN.
  admin_listen: "127.0.0.1:9090"

# To send traces, set the URL of an OTLP/HTTP receiver, for example Jaeger.
# telemetry:
#   otlp_endpoint: http://localhost:4318

# The store of the rate limit and budget counters. Use memory for one
# Tollgate copy. To share the limits between copies, use redis:
#   kind: redis
#   redis_url: env:REDIS_URL
store:
  kind: memory

# Tollgate writes one usage event for each request to this file. With the
# memory store, Tollgate reads the file at start to keep the month spend.
usage:
  sink: jsonl
  path: ./data/usage.jsonl

# Tollgate has a price table for the Anthropic models below. To use other
# prices, copy pricing.yaml from the repository and set its path here.
# pricing:
#   file: ./pricing.yaml

# These defaults apply to all routes. See docs/reliability.md.
retry:
  max_attempts: 3
  budget_ratio: 0.1
breaker:
  failure_ratio: 0.5
  min_requests: 20
  open_for: 30s

providers:
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    # Tollgate reads the key from this environment variable.
    # Do not put a key in this file.
    api_key: env:ANTHROPIC_API_KEY
  # To use OpenAI, remove the "#" from these lines, and add an openai route.
  # openai:
  #   kind: openai
  #   base_url: https://api.openai.com
  #   api_key: env:OPENAI_API_KEY

# Add targets in fallback order. Anthropic routes accept anthropic or
# vertex providers. OpenAI routes accept openai or ollama providers.
# A vertex provider needs project, region, and Google credentials.
# An ollama provider defaults to http://localhost:11434 and needs no key.
# One route for each model name that clients send.
# Make sure that the model names agree with the models of your client.
routes:
  - model: claude-opus-5-5
    api: anthropic
    targets:
      - provider: anthropic
  - model: claude-sonnet-5-5
    api: anthropic
    targets:
      - provider: anthropic
    # These timeouts are the defaults. Each route can change them.
    timeouts:
      connect: 5s
      first_token: 30s
      idle: 60s
      total: 15m
  - model: claude-haiku-5-5
    api: anthropic
    targets:
      - provider: anthropic

tenants:
  - id: personal
    # Run "tollgate keys create -id laptop" and paste its lines here.
    keys: []
    models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
    # The rate limits of the tenant. 0 means no limit.
    limits:
      requests_per_minute: 0
      tokens_per_minute: 0
    # The budgets of the tenant, in USD. A hard budget refuses requests
    # with status 402. A soft budget only writes a warning to the log.
    # budgets:
    #   - window: month
    #     limit_usd: 50
    #     mode: hard
    #   - window: session
    #     limit_usd: 5
    #     mode: hard
