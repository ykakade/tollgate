version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /test/sdk
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
