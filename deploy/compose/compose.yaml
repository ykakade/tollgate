# The Tollgate demo stack: Tollgate, three fake providers, a load generator,
# Prometheus, Grafana and Jaeger. Start it with "make demo".
# See docs/observability.md. The ports bind to 127.0.0.1 only.
name: tollgate-demo

x-tollgate-image: &tollgate-image
  image: tollgate-demo:local
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile

services:
  fake-primary:
    <<: *tollgate-image
    entrypoint: ["fakeprovider"]
    command: ["-listen", "0.0.0.0:8090", "-first-token-delay", "400ms", "-token-interval", "30ms"]

  fake-backup:
    <<: *tollgate-image
    entrypoint: ["fakeprovider"]
    command: ["-listen", "0.0.0.0:8090", "-first-token-delay", "700ms", "-token-interval", "40ms"]

  fake-flaky:
    <<: *tollgate-image
    entrypoint: ["fakeprovider"]
    command: ["-listen", "0.0.0.0:8090", "-scenario", "status:529"]

  tollgate:
    <<: *tollgate-image
    command: ["serve", "-config", "/etc/tollgate/tollgate.yaml"]
    volumes:
      - ./tollgate.yaml:/etc/tollgate/tollgate.yaml:ro
      - ./admin-token:/etc/tollgate/admin-token:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on: [fake-primary, fake-backup, fake-flaky, jaeger]

  loadgen:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["/bin/sh", "/loadgen.sh", "4"]
    volumes:
      - ./loadgen.sh:/loadgen.sh:ro
    depends_on: [tollgate]

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./admin-token:/etc/prometheus/admin-token:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on: [tollgate]

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tollgate.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Mount only these folders: the image has the other provisioning
      # folders, and Grafana logs an error if one is missing.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:16686:16686"
