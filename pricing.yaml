# The Tollgate price table. Tollgate has a copy of this file in the binary.
# To use other prices, copy this file, change the copy, and set pricing.file
# in the configuration. See docs/configuration.md.
#
# Each entry gives the prices of one model from a date, in micro-USD for each
# million tokens (1 USD = 1,000,000 micro-USD). To change a price, add an
# entry with a later effective_from date. Do not change an old entry.
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing
# (read on 2026-10-24). The effective_from date is the date that the prices
# were read, not the date that the provider set them.

- provider: anthropic
  model: claude-fable-5-1
  effective_from: 2026-10-24
  micro_usd_per_mtok:
    input: 10000000
    output: 50000000
    cache_read: 250000
    cache_write: 12500000
    cache_write_1h: 20000000

- provider: anthropic
  model: claude-opus-5-5
  effective_from: 2026-10-24
  micro_usd_per_mtok:
    input: 4000000
    output: 20000000
    cache_read: 200000
    cache_write: 5000000
    cache_write_1h: 8000000

- provider: anthropic
  model: claude-sonnet-5-5
  effective_from: 2026-10-24
  micro_usd_per_mtok:
    input: 2000000
    output: 10000000
    cache_read: 100000
    cache_write: 2500000
    cache_write_1h: 4000000

# Claude Haiku 5.5 has higher prices for a prompt with more than 100,000
# tokens. The prompt counts the input, cache read and cache write tokens.
- provider: anthropic
  model: claude-haiku-5-5
  effective_from: 2026-10-24
  micro_usd_per_mtok:
    input: 100000
    output: 500000
    cache_read: 10000
    cache_write: 125000
    cache_write_1h: 200000
  long_context:
    above_prompt_tokens: 100000
    micro_usd_per_mtok:
      input: 500000
      output: 2500000
      cache_read: 50000
      cache_write: 625000
      cache_write_1h: 1000000
